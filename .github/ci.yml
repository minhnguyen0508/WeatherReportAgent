name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Syntax and unit tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Unit tests only import weather_service.py. No AWS secrets, model calls,
      # or live Open-Meteo requests are needed for this CI check.
      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests tzdata

      - name: Check Python syntax
        run: python -m compileall -q app/agent

      - name: Run weather-service unit tests
        env:
          PYTHONPATH: app/agent
        run: python -m pytest tests -v
